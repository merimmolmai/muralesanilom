<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="760" viewBox="0 0 1024 760">
  <defs>
    <linearGradient id="dentro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4750"/>
      <stop offset=".6" stop-color="#55646c"/>
      <stop offset="1" stop-color="#6d7a80"/>
    </linearGradient>
    <linearGradient id="fachada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dfd2"/>
      <stop offset="1" stop-color="#efe9df"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".14"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="700" fill="url(#fachada)"/>
  <!-- banda del letrero -->
  <rect x="70" y="110" width="910" height="52" fill="#d6cdbf"/>
  <rect x="70" y="160" width="910" height="4" fill="#c4baab"/>
  <!-- escaparate: marco y cristal (cristal de x 104 a 736 y de y 194 a 616) -->
  <rect x="90" y="180" width="660" height="450" fill="#3b3f44"/>
  <rect x="104" y="194" width="632" height="422" fill="url(#dentro)"/>
  <!-- interior de la tienda, apenas visible -->
  <g fill="#2f3a41" opacity=".55">
    <rect x="140" y="300" width="180" height="8"/>
    <rect x="140" y="380" width="180" height="8"/>
    <rect x="140" y="460" width="180" height="8"/>
    <rect x="520" y="430" width="170" height="186"/>
    <circle cx="420" cy="250" r="16"/>
    <rect x="417" y="194" width="6" height="40"/>
  </g>
  <!-- zócalo bajo el escaparate -->
  <rect x="90" y="630" width="660" height="70" fill="#b8ae9f"/>
  <rect x="90" y="630" width="660" height="5" fill="#a39888"/>
  <!-- puerta -->
  <rect x="790" y="180" width="170" height="520" fill="#3b3f44"/>
  <rect x="804" y="194" width="142" height="492" fill="url(#dentro)"/>
  <rect x="804" y="194" width="142" height="492" fill="url(#brillo)"/>
  <rect x="818" y="420" width="8" height="70" rx="4" fill="#c9ccd0"/>
  <!-- acera -->
  <rect y="700" width="1024" height="60" fill="#c9c2b6"/>
  <rect y="700" width="1024" height="4" fill="#aaa294"/>
  <g stroke-width="2" opacity=".5">
    <path d="M0 730H1024" stroke="#b5ad9f"/>
    <path d="M128 704V760M320 704V760M512 704V760M704 704V760M896 704V760" stroke="#b5ad9f"/>
  </g>
</svg>
